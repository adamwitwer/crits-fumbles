<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="A fantasy dice-rolling app for critical hits and fumbles.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Crits & Fumbles</title>
    
    <!-- to help with "cold start"-->
    <link rel="prefetch"
      href="{{ url_for('static', filename='img/d20.webp') }}"
      as="image"
      type="image/webp">

    <link rel="prefetch"
      href="{{ url_for('static', filename='img/d10.webp') }}"
      as="image"
      type="image/webp">

    <link rel="prefetch"
      href="{{ url_for('static', filename='sounds/dice-roll.mp3') }}"
      as="audio"
      type="audio/mpeg">

    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" sizes="any" type="image/svg+xml">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="48x48">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">

    <meta name="color-scheme" content="light dark">

    <meta name="apple-mobile-web-app-title" content="Crits & Fumbles">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>
<body>

<main id="main-content">
  <h1>Crits & Fumbles</h1>

  <form id="main-form">
    <div>
      <label for="roll_type">Roll Type</label>
      <select name="roll_type" id="roll_type">
        <option value="crit" {% if selected_roll_type == 'crit' %}selected{% endif %}>Critical</option>
        <option value="fumble" {% if selected_roll_type == 'fumble' %}selected{% endif %}>Fumble</option>
      </select>
    </div>

    <div id="crit-source-container" style="display:none;">
      <label for="crit_source">Crit Type</label>
      <button
      type="button"
      class="info-icon"
      id="crit_source_info_icon"
      style="display: none;"
      data-tooltip="About this crit type"
      aria-label="More info about this crit type"
      >
      ⓘ
      </button>
      <select name="crit_source" id="crit_source">
        <option value="Sterling Vermin" {% if selected_crit_source == 'Sterling Vermin' %}selected{% endif %}>Sterling Vermin</option>
        <option value="Questionable Arcana" {% if selected_crit_source == 'Questionable Arcana' %}selected{% endif %}>Questionable Arcana</option>
        <option value="BCoydog" {% if selected_crit_source == 'BCoydog' %}selected{% endif %}>u/BCoydog</option>
      </select>
      <div id="crit-fields" style="display:none;">
        <div>
          <label for="damage_type">Damage Type</label>
          <select name="damage_type" id="damage_type">
            {# Options populated by JavaScript #}
          </select>
        </div>
        <div id="magic-subtype" style="display: none;">
          <label for="magic_subtype">Magic Type</label>
          <select name="magic_subtype" id="magic_subtype">
            {# Options populated by JavaScript #}
          </select>
        </div>
      </div>
    </div>

    <div id="fumble-type-container" style="display:none;">
      <label for="fumbleType">Fumble Type</label>
      <button
      type="button"
      class="info-icon"
      id="fumble_type_info_icon"
      style="display: none;"
      data-tooltip="About this fumble type"
      aria-label="More info about this fumble type"
      >
      ⓘ
      </button>
      <select id="fumbleType" name="fumbleType">
        <option value="Questionable Arcana" {% if selected_fumble_type == 'Questionable Arcana' %}selected{% endif %}>Questionable Arcana</option>
        <option value="BCoydog" {% if selected_fumble_type == 'BCoydog' %}selected{% endif %}>u/BCoydog</option>
      </select>
      <div id="attack-type-container" style="display:none;">
        <label for="attackType">Attack Type</label>
        <select id="attackType" name="attackType">
          <option value="Weapon" {% if selected_attack_type == 'Weapon' %}selected{% endif %}>Weapon</option>
          <option value="Magic" {% if selected_attack_type == 'Magic' %}selected{% endif %}>Magic</option>
        </select>
      </div>
    </div>

    <button
    type="button"
    id="mute-button"
    aria-pressed="false"
    aria-label="Mute dice sound"
    data-tooltip="Mute dice rolling"
    >🔊</button>

    <button type="button" id="primary-roll-button" aria-label="Roll dice for result">⚡️ Roll ⚡️</button>

  </form>

  <div id="error-message" style="display: none; color: red; text-align: center; margin: 1rem 0;"></div>
  <div id="primary-result-area" style="display: none;" role="region" aria-live="polite" aria-atomic="true"></div>
  <div id="secondary-prompt-area" style="display: none;" class="bonus-alert">
      <h2 id="secondary-prompt-text"></h2>
      <input type="hidden" id="secondary-roll-type-hidden">
      <input type="hidden" id="secondary-crit-source-hidden">
      <input type="hidden" id="secondary-damage-type-hidden">
      <input type="hidden" id="secondary-magic-subtype-hidden">
      <input type="hidden" id="secondary-primary-result-hidden">
      <input type="hidden" id="secondary-primary-roll-hidden">
      <button type="button" id="secondary-roll-button" aria-label="Roll dice for bonus effect">⚡️ Roll Bonus ⚡️</button>
  </div>
  <div id="secondary-result-area" style="display: none;" aria-live="polite"></div>

  <div class="share-container"><button type="button" id="share-discord-button" style="display: none;">
    <img src="{{ url_for('static', filename='img/discord-icon.svg') }}" alt="Discord Logo" class="discord-icon">
    <span class="button-text">Share Result to Discord</span></button>
  </div>

  <audio id="dice-sound" preload="auto">
      <source src="{{ url_for('static', filename='sounds/dice-roll.mp3') }}" type="audio/mpeg">
      Your browser does not support the audio element.
  </audio>
  
  <footer class="app-footer" role="contentinfo">
    <p><a href="https://github.com/adamwitwer/crits-fumbles" target="_blank" rel="noopener" aria-label="GitHub Repository">
      <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 0C5.37 0 0 5.373 0 12c0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577v-2.17c-3.338.726-4.033-1.416-4.033-1.416-.546-1.386-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.776.42-1.304.762-1.603-2.665-.305-5.466-1.334-5.466-5.933 0-1.31.47-2.38 1.235-3.22-.124-.303-.535-1.527.117-3.176 0 0 1.008-.322 3.3 1.23.957-.266 1.98-.399 3-.404 1.02.005 2.043.138 3 .404 2.29-1.552 3.296-1.23 3.296-1.23.653 1.649.242 2.873.118 3.176.767.84 1.233 1.91 1.233 3.22 0 4.61-2.804 5.625-5.475 5.922.43.37.823 1.103.823 2.222v3.293c0 .322.218.694.825.576C20.565 21.796 24 17.298 24 12c0-6.627-5.373-12-12-12z" /></svg></a>
      | <button
        id="show-history-button"
        class="chronicles-button"
        type="button"
        aria-label="View Crits & Fumbles Chronicles"
        data-tooltip="View the Chronicles"
        >
        📜 C&F Chronicles
        </button>
    </p>
  </footer>
</main>
  
<div id="dice-animation-overlay">
    <div class="rolling-animation-container"></div>
</div>

<div id="info-modal-overlay" class="modal-overlay">
  <div id="info-modal" class="modal-content" tabindex="-1" role="dialog" aria-modal="true">
    <button id="info-modal-close-button" class="modal-close-button" aria-label="Close modal"></button>
    <h2 id="info-modal-title">Source Information</h2>
    <p id="info-modal-text" tabindex="0">Information will appear here.</p>
  </div>
</div>

<div id="history-overlay">
  <div id="history-modal" tabindex="-1" role="dialog" aria-modal="true">
    <div class="history-header">
      <h2>Chronicles</h2>
    </div>
    <div id="history-content" tabindex="0"></div>
    <button id="close-history-modal" class="modal-close-button" aria-label="Close Chronicles"></button>
  </div>
</div> 

<script>
  window.CF_CONFIG = {
    rollAjax:    "{{ url_for('roll_ajax') }}",
    historyApi:  "{{ url_for('get_roll_history') }}",
    shareDiscord:"{{ url_for('share_discord') }}",
    imgBase:     "{{ url_for('static', filename='img/') }}",
    d10Img:      "{{ url_for('static', filename='img/d10.webp') }}",
    discordIcon: "{{ url_for('static', filename='img/discord-icon.svg') }}"
  };
</script>
<script defer src="{{ url_for('static', filename='js/purify.min.js') }}"></script>
<script defer src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
